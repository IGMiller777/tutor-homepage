<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Начнём завтра</title>
<style>
  :root {
    --bg: #faf8f5;
    --text: #1c1e22;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --text: #e9ecef;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 4.5rem);
    font-weight: 600;
    letter-spacing: -.02em;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Начнём завтра</h1>
</body>
</html>
